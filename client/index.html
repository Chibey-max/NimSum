<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#14162B" />
    <meta name="description" content="A new hex puzzle every day. Link neighbours to hit the target in as few hops as you can." />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>NimSum</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter+Tight:wght@400;500;600&family=Martian+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <script>
      // Set before first paint so a returning light-theme visitor never sees
      // a flash of the dark default.
      if (localStorage.getItem('nimsum.theme') === 'light') {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
